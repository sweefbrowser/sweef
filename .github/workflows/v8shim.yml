name: v8shim

# EXPERIMENTAL CI: builds the Rust cdylib (rusty_v8), runs the purego shim tests
# (internal/v8shim) on every platform and the engine's JavaScript tests on the V8 runtime
# (SWEEF_JS_ENGINE=v8) on Linux. Never runs for changes outside the V8 files and
# never affects the main ci workflow.
#
# TODO(owner): pin every `uses:` by full commit SHA, same as ci.yml.

on:
  pull_request:
    paths:
      - "experimental/v8shim/**"
      - "internal/v8shim/**"
      - "internal/engine/jsrt*.go"
      - "internal/engine/jsruntime.go"
      - ".github/workflows/v8shim.yml"
  push:
    paths:
      - "experimental/v8shim/**"
      - "internal/v8shim/**"
      - "internal/engine/jsrt*.go"
      - "internal/engine/jsruntime.go"
      - ".github/workflows/v8shim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8shim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shim:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,    os: ubuntu-latest,    lib: libsweef_v8shim.so }
          - { name: linux-arm64,  os: ubuntu-24.04-arm, lib: libsweef_v8shim.so }
          - { name: windows-x64,  os: windows-latest,   lib: sweef_v8shim.dll }
          - { name: windows-arm64, os: windows-11-arm,  lib: sweef_v8shim.dll }
          # macos-13 was retired by GitHub; macos-15-intel is the x86_64 runner.
          - { name: macos-x64,    os: macos-15-intel,   lib: libsweef_v8shim.dylib }
          - { name: macos-arm64,  os: macos-14,         lib: libsweef_v8shim.dylib }
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4          # TODO: pin by SHA
      - uses: actions/setup-go@v5          # TODO: pin by SHA
        with:
          go-version-file: go.mod
          cache: false

      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup missing, installing"
            if [ "${{ runner.os }}" = "Windows" ]; then
              arch=x86_64; [ "${{ runner.arch }}" = "ARM64" ] && arch=aarch64
              curl -sSfL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/${arch}-pc-windows-msvc/rustup-init.exe"
              ./rustup-init.exe -y --default-toolchain stable --profile minimal
              echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$USERPROFILE/.cargo/bin:$PATH"
            else
              curl -sSfL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
          fi
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Rust fmt and clippy (linux x64 only)
        if: matrix.name == 'linux-x64'
        working-directory: experimental/v8shim/rust
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Build cdylib (release)
        working-directory: experimental/v8shim/rust
        run: cargo build --release

      - name: Library size
        id: size
        working-directory: experimental/v8shim/rust/target/release
        run: |
          ls -l "${{ matrix.lib }}"
          bytes=$(wc -c < "${{ matrix.lib }}")
          echo "${{ matrix.name }} ${{ matrix.lib }} $bytes bytes" | tee size.txt
          echo "### ${{ matrix.name }}: ${{ matrix.lib }} = $bytes bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Go vet, build (CGO off)
        run: |
          test -z "$(gofmt -l internal/v8shim internal/engine)"
          go vet ./internal/v8shim/... ./internal/engine/
          go vet -tags sweef_v8 ./internal/v8shim/... ./internal/engine/
          go build -tags sweef_v8 ./internal/v8shim/... ./internal/engine/
          # evidence that the Go side is cgo-free
          go build -tags sweef_v8 -o v8bench-bin ./internal/v8shim/cmd/v8bench
          go version -m v8bench-bin | grep -E "CGO_ENABLED|-tags|^v8bench-bin"

      - name: The default Linux build stays static (linux-x64)
        if: matrix.name == 'linux-x64'
        run: |
          # purego makes a Linux binary dynamic; only -tags sweef_v8 builds may be
          go build -o sweef-default ./cmd/sweef
          if readelf -l sweef-default | grep -q INTERP; then echo "default Linux build is dynamically linked"; exit 1; fi
          echo "default build: static"

      - name: Go tests against the real V8 library
        env:
          SWEEF_V8_REQUIRE: "1"
        run: |
          export SWEEF_V8_LIB="$GITHUB_WORKSPACE/experimental/v8shim/rust/target/release/${{ matrix.lib }}"
          go test -tags sweef_v8 -count=1 -v ./internal/v8shim/... 2>&1 | tee test.log | tail -n 60

      - name: Engine JavaScript tests on the V8 runtime (linux-x64)
        if: matrix.name == 'linux-x64'
        env:
          SWEEF_JS_ENGINE: v8
          SWEEF_V8_REQUIRE: "1"
        run: |
          export SWEEF_V8_LIB="$GITHUB_WORKSPACE/experimental/v8shim/rust/target/release/${{ matrix.lib }}"
          go test -tags sweef_v8 -count=1 -timeout 20m -run 'TestJS|TestV8|TestEvaluateAndConsole|TestSnapshotAndScreenshot' ./internal/engine/ 2>&1 | tee engine-v8.log | tail -n 40

      - name: Report (size and test summary)
        if: always()
        run: |
          cat experimental/v8shim/rust/target/release/size.txt
          grep -E "^(--- |ok|FAIL|PASS)" test.log | awk '{print $1,$2}' | sort | uniq -c | sort -rn | head -5

      - name: Upload library
        if: always()
        uses: actions/upload-artifact@v4    # TODO: pin by SHA
        with:
          name: v8shim-${{ matrix.name }}
          path: |
            experimental/v8shim/rust/target/release/${{ matrix.lib }}
            experimental/v8shim/rust/target/release/size.txt
            test.log
            engine-v8.log
          if-no-files-found: warn
          retention-days: 7
